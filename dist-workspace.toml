[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist), which builds the release binaries, the
# installers and the Homebrew formula on GitHub Actions when a version tag
# is pushed. Regenerate the workflow after editing with: dist generate
[dist]
# The version of dist to use for generating installers and CI scripts
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app: the shell script for macOS and
# Linux, the PowerShell script for Windows, and the Homebrew formula
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap the formula is pushed to.
tap = "boraoku/homebrew-apps"
# Target platforms to build apps for (Rust target-triple syntax): both
# Macs, Linux on Intel and ARM (glibc), which also serves WSL, and Windows
# on x86_64 (MSVC)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI: the formula to the tap, and the universal
# macOS binary made from the two builds (.github/workflows/publish-universal.yml)
publish-jobs = ["homebrew", "./publish-universal"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program (axoupdater, a later milestone)
install-updater = false
# TEMPORARY, revert to "plan" before merging: builds every release
# artifact on the pull request, to prove the Windows build.
pr-run-mode = "upload"
# The universal job uploads to the release, so it needs to write contents.
github-custom-job-permissions = { "publish-universal" = { contents = "write" } }

# The Homebrew formula installs rclone too: OneFolder needs it on PATH.
[dist.dependencies.homebrew]
rclone = { stage = ["run"] }
