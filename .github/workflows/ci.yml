name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # rclone is installed only in the integration job, and the accounts
      # tests refuse to skip under CI, so they run there instead.
      - name: Unit, snapshot and CLI tests
        run: cargo test --bins --test cli

  integration:
    name: Integration (rclone, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install rclone and just (Homebrew)
        if: runner.os == 'macOS'
        run: brew install rclone just
      - name: Install rclone and just (their own installers)
        if: runner.os == 'Linux'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin
      - name: rclone version
        run: rclone version
      - name: Accounts tests (alias remote, fake sign-in under a pseudo-terminal)
        run: cargo test --test accounts
      - name: Integration tests
        run: just test-integration
      # Re-records the rclone fixtures with this rclone and checks the
      # decoder's snapshots without updating them, so a release that changes
      # rclone's log lines fails here rather than in a user's run. Runs on
      # both systems: rclone's local backend differs between them.
      - name: Fixtures still decode the same
        run: just fixtures

  # Real runs on Windows itself with a real rclone: the integration suite
  # fakes rclone with /bin/sh scripts, so it runs on Unix only. A job with
  # a one-way and a two-way local destination is added from flags and run
  # twice, and the files are checked on each side.
  smoke-windows:
    name: Smoke (rclone, windows-latest)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install rclone (Chocolatey)
        run: choco install rclone -y --no-progress
      - name: rclone version
        run: rclone version
      - name: Build
        run: cargo build
      - name: Add a job and run it twice
        env:
          NO_COLOR: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $of = "$PWD\target\debug\onefolder.exe"
          $root = Join-Path $env:RUNNER_TEMP 'of'
          $env:ONEFOLDER_CONFIG_DIR = "$root\config"
          $env:ONEFOLDER_DATA_DIR = "$root\data"
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what exited with $LASTEXITCODE" } }
          function Expect($file, $text) {
            if (-not (Test-Path $file)) { throw "missing: $file" }
            $got = (Get-Content -Raw $file).Trim()
            if ($got -ne $text) { throw "$file has '$got', expected '$text'" }
          }
          New-Item -ItemType Directory -Force "$root\src\Docs", "$root\copy", "$root\both" | Out-Null
          Set-Content "$root\src\a.txt" 'one'
          Set-Content "$root\src\Docs\b.txt" 'two'

          & $of jobs add documents --source "$root\src" --local "$root\copy" --local "$root\both:two-way"
          Check 'jobs add'
          & $of jobs list
          Check 'jobs list'

          & $of run documents --yes
          Check 'first run'
          Expect "$root\copy\a.txt" 'one'
          Expect "$root\copy\Docs\b.txt" 'two'
          Expect "$root\both\Docs\b.txt" 'two'

          # A change on the two-way side comes back; a new file goes out.
          Start-Sleep -Seconds 2
          Set-Content "$root\both\Docs\b.txt" 'changed'
          Set-Content "$root\src\c.txt" 'three'
          & $of run documents --yes
          Check 'second run'
          Expect "$root\src\Docs\b.txt" 'changed'
          Expect "$root\copy\c.txt" 'three'
          Expect "$root\both\c.txt" 'three'

          & $of status
          Check 'status'
          & $of doctor

  # dist plans every target (macOS and Linux) from one machine.
  release-plan:
    name: Release plan (dist)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh"
      # Fails when dist-workspace.toml, Cargo.toml and release.yml disagree
      # (run `dist generate` after changing the dist config).
      - name: dist plan
        run: dist plan
      - name: Release workflow is up to date
        run: dist generate --check
